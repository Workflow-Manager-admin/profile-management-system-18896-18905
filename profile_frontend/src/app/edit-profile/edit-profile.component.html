<div class="edit-profile-card">
  <div class="edit-profile-header">
    <h2>Edit Profile</h2>
  </div>
  <form class="edit-profile-form" autocomplete="off" (ngSubmit)="saveProfile()">
    <!-- Profile Name -->
    <div class="form-group">
      <label for="profileName">Profile Name</label>
      <input 
        id="profileName"
        name="profileName"
        type="text"
        [(ngModel)]="profileName"
        class="profile-input"
        maxlength="48"
        tabindex="1"
        required
        aria-label="Profile Name"
        placeholder="Enter your name"
      />
    </div>

    <!-- Profile Type Dropdown -->
    <div class="form-group">
      <label for="profileType">Profile Type</label>
      <select 
        id="profileType"
        name="profileType"
        [(ngModel)]="profileType"
        class="profile-dropdown"
        tabindex="2"
        aria-label="Profile Type"
        required
      >
        <option *ngFor="let option of typeOptions" [value]="option">{{ option }}</option>
      </select>
    </div>

    <!-- Add Device Dropdown -->
    <div class="form-group">
      <label for="addDevice">Add Device</label>
      <select 
        id="addDevice"
        name="addDevice"
        [(ngModel)]="addDevice"
        class="profile-dropdown"
        tabindex="3"
        aria-label="Add device to profile"
      >
        <option value="" disabled selected>Add a device…</option>
        <option *ngFor="let device of availableDevices" [value]="device">{{ device }}</option>
      </select>
    </div>

    <!-- Options Row -->
    <div class="options-row form-group" aria-label="Options section">
      <!-- Upload Box -->
      <div class="option-upload-box">
        <label class="upload-label" for="profileFile">
          <span class="material-icons upload-icon">cloud_upload</span>
          <span>{{ fileName ? fileName : 'Upload image or document' }}</span>
          <input 
            type="file"
            class="upload-input"
            id="profileFile"
            tabindex="4"
            (change)="onFileSelected($event)"
            aria-label="Upload profile file"
          />
        </label>
      </div>
      <!-- Checkbox Option -->
      <div class="option-checkbox">
        <label>
          <input 
            type="checkbox"
            [(ngModel)]="optionChecked"
            name="optionChecked"
            tabindex="5"
            aria-label="Enable Profile Option"
          />
          <span>Enable advanced options</span>
        </label>
      </div>
    </div>

    <!-- Save Button -->
    <div class="form-actions">
      <button 
        type="submit"
        class="save-btn"
        [disabled]="!profileName || !profileType"
        tabindex="6"
        aria-label="Save changes"
      >
        <span class="material-icons">save</span>
        Save Changes
      </button>
    </div>
  </form>
</div>
